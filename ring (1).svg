<svg xmlns="http://www.w3.org/2000/svg" width="320" height="46" viewBox="0 0 320 46">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F5AF0"/>
      <stop offset="50%" stop-color="#2CB67D"/>
      <stop offset="100%" stop-color="#F25F4C"/>
    </linearGradient>
  </defs>

  <!-- Base track -->
  <rect x="10" y="20" width="300" height="6" rx="3" fill="#302b63" opacity="0.5"/>

  <!-- Animated sweeping gradient bar -->
  <rect x="10" y="20" width="80" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="x" values="10;230;10" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Pulsing dots -->
  <circle cx="30" cy="23" r="5" fill="#7F5AF0">
    <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="23" r="5" fill="#2CB67D">
    <animate attributeName="r" values="4;7;4" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="23" r="5" fill="#F25F4C">
    <animate attributeName="r" values="4;7;4" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
