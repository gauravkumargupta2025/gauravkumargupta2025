<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F5AF0"/>
      <stop offset="35%" stop-color="#2CB67D"/>
      <stop offset="70%" stop-color="#F25F4C"/>
      <stop offset="100%" stop-color="#7F5AF0"/>
    </linearGradient>

    <clipPath id="circleClip">
      <circle cx="110" cy="110" r="82"/>
    </clipPath>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulsing glow backdrop -->
  <circle cx="110" cy="110" r="90" fill="none" stroke="#7F5AF0" stroke-width="2" opacity="0.35">
    <animate attributeName="r" values="86;98;86" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating gradient ring (outer, clockwise) -->
  <g filter="url(#glow)">
    <circle cx="110" cy="110" r="86" fill="none" stroke="url(#ringGrad)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="380 160">
      <animateTransform attributeName="transform" type="rotate"
                         from="0 110 110" to="360 110 110"
                         dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Rotating dashed ring (inner, counter-clockwise, faster) -->
  <circle cx="110" cy="110" r="94" fill="none" stroke="#2CB67D" stroke-width="2"
          stroke-dasharray="6 10" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate"
                       from="360 110 110" to="0 110 110"
                       dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Profile photo, clipped to circle -->
  <image href="https://plain-apac-prod-public.komododecks.com/202608/19/JwHtntE7YapdFRNqI8Ka/image.jpg"
         x="28" y="28" width="164" height="164"
         clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Inner border on photo -->
  <circle cx="110" cy="110" r="82" fill="none" stroke="#0f0c29" stroke-width="3"/>
</svg>
